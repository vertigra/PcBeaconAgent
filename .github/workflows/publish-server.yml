name: Publish Server Release

on:
  push:
    tags:
      - 'server.v.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.parse_version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Parse Version
        id: parse_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'server\.v\.(\d+)\.(\d+)\.(\d+)') {
              echo "VERSION_NAME=$($Matches[1]).$($Matches[2]).$($Matches[3])" >> $env:GITHUB_OUTPUT
          } else { exit 1 }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x 

      - name: Publish
        run: |
          dotnet publish src/PcBeaconAgent.Server.Cli/PcBeaconAgent.Server.Cli.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None `
            -p:PublishDir=../../publish -p:AppVersionName=${{ steps.parse_version.outputs.VERSION_NAME }}

      - name: Create Zip
        run: Compress-Archive -Path ./publish/* -DestinationPath ./PcBeaconAgent.Server.Cli-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-package
          path: ./PcBeaconAgent.Server.Cli-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-package
      - name: Unzip and Test
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip
          Expand-Archive -Path $zip.FullName -DestinationPath ./test-app
          $proc = Start-Process -FilePath "./test-app/PcBeaconAgent.Server.Cli.exe" -ArgumentList "--urls http://localhost:5000" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { Write-Error "Server crashed!"; exit 1 }
          Stop-Process -Id $proc.Id

  publish:
    needs: [build, smoke-test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
        
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-package

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.1
        with:
          files: PcBeaconAgent.Server.Cli-${{ needs.build.outputs.version }}-win-x64.zip
          name: Server Release ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}