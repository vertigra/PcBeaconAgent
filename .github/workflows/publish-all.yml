name: Publish Release

on:
  push:
    tags:
      - 'release.v.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/PcBeaconAgent.Server.Core.Tests/PcBeaconAgent.Server.Core.Tests.csproj --configuration Release --logger trx --collect:"XPlat Code Coverage"

      - name: Find coverage file
        id: find
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if (-not $file) { Write-Error "No coverage file found"; exit 1 }
          echo "path=$($file.FullName)" >> $env:GITHUB_OUTPUT

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: Server.Core
          format: cobertura
          file: ${{ steps.find.outputs.path }}

  build-server:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Parse Version
        id: parse_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'release\.v\.(\d+)\.(\d+)\.(\d+)') {
              echo "VERSION_NAME=$($Matches[1]).$($Matches[2]).$($Matches[3])" >> $env:GITHUB_OUTPUT
          } else { exit 1 }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Server.Cli
        run: |
          dotnet publish src/PcBeaconAgent.Server.Cli/PcBeaconAgent.Server.Cli.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None `
            -p:PublishDir=../../publish-cli -p:AppVersionName=${{ steps.parse_version.outputs.VERSION_NAME }}

      - name: Publish Server.Tray
        run: |
          dotnet publish src/PcBeaconAgent.Server.Tray/PcBeaconAgent.Server.Tray.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None `
            -p:PublishDir=../../publish-tray -p:AppVersionName=${{ steps.parse_version.outputs.VERSION_NAME }}

      - name: Create Zip - Cli
        run: Compress-Archive -Path ./publish-cli/* -DestinationPath ./PcBeaconAgent.Server.Cli-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip

      - name: Create Zip - Tray
        run: Compress-Archive -Path ./publish-tray/* -DestinationPath ./PcBeaconAgent.Server.Tray-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip

      - name: Upload Cli Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-cli-package
          path: ./PcBeaconAgent.Server.Cli-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip

      - name: Upload Tray Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-tray-package
          path: ./PcBeaconAgent.Server.Tray-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip

  build-client:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Parse Version from Tag
        id: parse_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'release\.v\.(\d+)\.(\d+)\.(\d+)') {
              $versionName = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
              $versionCode = ([int]$Matches[1] * 1000000) + ([int]$Matches[2] * 1000) + [int]$Matches[3]
              echo "VERSION_NAME=$versionName" >> $env:GITHUB_OUTPUT
              echo "VERSION_CODE=$versionCode" >> $env:GITHUB_OUTPUT
          } else {
              Write-Error "Tag $tag does not match format release.v.X.Y.Z"
              exit 1
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Workloads and Dependencies
        run: |
          dotnet workload restore src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj
          dotnet restore src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj

      - name: Publish Android App
        run: |
          dotnet publish src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj `
            -c Release `
            -f net10.0-android `
            -p:AndroidKeyStore=false `
            -p:AndroidPackageFormat=apk `
            -p:AppVersionCode=${{ steps.parse_version.outputs.VERSION_CODE }} `
            -p:AppVersionName=${{ steps.parse_version.outputs.VERSION_NAME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-apk-package
          path: |
            ./BeaconClient-v.*.apk

      - name: Prepare Artifact
        shell: pwsh
        run: |
          $apkPath = Get-ChildItem -Path src/PcBeaconAgent.Client.Android/ -Filter *.apk -Recurse | Select-Object -First 1
          if ($apkPath) {
              Copy-Item $apkPath.FullName -Destination "./BeaconClient-v.${{ steps.parse_version.outputs.VERSION_NAME }}.apk"
          } else {
              Write-Error "APK not found!"
              exit 1
          }

  smoke-test:
    needs: [build-server, build-client]
    runs-on: windows-latest
    steps:
      - name: Download Cli Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-cli-package

      - name: Download Tray Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-tray-package

      - name: Smoke test - Server.Cli
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *Cli*.zip
          Expand-Archive -Path $zip.FullName -DestinationPath ./test-cli
          $proc = Start-Process -FilePath "./test-cli/PcBeaconAgent.Server.Cli.exe" -ArgumentList "--urls http://localhost:5000" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { Write-Error "Server.Cli crashed!"; exit 1 }
          Stop-Process -Id $proc.Id

      - name: Smoke test - Server.Tray
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *Tray*.zip
          Expand-Archive -Path $zip.FullName -DestinationPath ./test-tray
          $proc = Start-Process -FilePath "./test-tray/PcBeaconAgent.Server.Tray.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { Write-Error "Server.Tray crashed!"; exit 1 }
          Stop-Process -Id $proc.Id

  publish:
    needs: [build-server, build-client, smoke-test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Version
        id: parse_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match 'release\.v\.(\d+)\.(\d+)\.(\d+)') {
              echo "VERSION_NAME=$($Matches[1]).$($Matches[2]).$($Matches[3])" >> $env:GITHUB_OUTPUT
          } else { exit 1 }

      - name: Download Cli Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-cli-package

      - name: Download Tray Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-tray-package

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-apk-package

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.1
        with:
          files: |
            PcBeaconAgent.Server.Cli-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip
            PcBeaconAgent.Server.Tray-${{ steps.parse_version.outputs.VERSION_NAME }}-win-x64.zip
            BeaconClient-v.${{ steps.parse_version.outputs.VERSION_NAME }}.apk
          name: Release ${{ steps.parse_version.outputs.VERSION_NAME }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
