name: Generate PR Description

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master

permissions:
  pull-requests: write

jobs:
  generate-description:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR Description
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            // All conventional-commit types are significant — not just
            // feat/fix/refactor. Excluding docs/test/ci made the PR
            // description show "No significant changes" when the PR
            // was purely documentation or test work.
            const conventionalTypes = [
              'feat', 'fix', 'perf', 'refactor', 'docs', 'test', 'ci', 'chore', 'build', 'style'
            ];
            
            const list = commits
              .map(c => c.commit.message.split('\n')[0])
              .filter(msg => 
                conventionalTypes.some(type => msg.startsWith(type + ':') || msg.startsWith(type + '('))
              )
              .map(msg => `- ${msg}`)
              .join('\n');
              
            const changesSection = `## 🚀 Changes\n\n${list || '*No significant changes detected.*'}\n\n---\n*Auto-generated by CI*`;
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            // Append or replace only the auto-generated section,
            // preserving any manual description the user wrote above it.
            let newBody;
            const marker = '## 🚀 Changes';
            if (pr.body && pr.body.includes(marker)) {
              // Replace the existing auto-generated section.
              const beforeMarker = pr.body.substring(0, pr.body.indexOf(marker));
              newBody = beforeMarker + changesSection;
            } else {
              // No existing section — append.
              newBody = (pr.body ? pr.body + '\n\n' : '') + changesSection;
            }
            
            if (pr.body !== newBody) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: newBody,
              });
              console.log("PR description updated.");
            } else {
              console.log("PR description is already up to date.");
            }