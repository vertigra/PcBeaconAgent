name: Generate PR Description

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master

permissions:
  pull-requests: write

jobs:
  generate-description:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR Description
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            const list = commits
              .map(c => c.commit.message.split('\n')[0])
              .filter(msg => 
                msg.startsWith('feat') || 
                msg.startsWith('fix') || 
                msg.startsWith('perf') || 
                msg.startsWith('refactor') ||
                msg.startsWith('chore')
              )
              .map(msg => `- ${msg}`)
              .join('\n');
              
            const newBody = `## 🚀 Changes\n\n${list || '*No significant changes detected.*'}\n\n---\n*Auto-generated by CI*`;
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            if (pr.body !== newBody) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: newBody,
              });
              console.log("PR description updated.");
            } else {
              console.log("PR description is already up to date.");
            }