name: Publish Single-File Release

on:
  push:
    tags:
      - 'v.*'

# Фикс ошибки 403: даем экшену права на создание релизов и запись файлов
permissions:
  contents: write

env:
  # Убираем ворнинг GitHub об устаревшей ноде (форсируем Node 24)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x 

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Single-File Executable
      # Фикс ворнинга: указываем путь к конкретному .csproj и собираем через PublishDir
      run: |
        dotnet publish src/PcBeaconAgent/PcBeaconAgent.csproj --configuration Release --runtime win-x64 -p:PublishSingleFile=true -p:PublishTrimmed=true --self-contained true -p:PublishDir=../../publish

    - name: Create Zip Archive
      # Скрипт заберет exe и appsettings.json из папки publish
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./PcBeaconAgentService-${{ github.ref_name }}-win-x64.zip

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./PcBeaconAgentService-${{ github.ref_name }}-win-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
