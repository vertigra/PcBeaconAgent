name: Tests

on:
  push:
    branches: [devel]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/PcBeaconAgent.Server.Core.Tests/PcBeaconAgent.Server.Core.Tests.csproj --configuration Release --logger trx --collect:"XPlat Code Coverage"

      - name: Upload to Coveralls
        if: github.ref == 'refs/heads/devel'
        shell: pwsh
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
        run: |
          $coverageFile = Get-ChildItem -Path . -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1
          if (-not $coverageFile) {
            Write-Error "No coverage file found"
            exit 1
          }
          $json = @{
            repo_token = $env:COVERALLS_REPO_TOKEN
            source_files = @()
          }
          [xml]$xml = Get-Content $coverageFile.FullName
          foreach ($file in $xml.coverage.packages.package.classes.class) {
            $sourcePath = $file.filename
            if (-not $sourcePath) { continue }
            $lines = @()
            foreach ($line in $file.lines.line) {
              $lines += [int]$line.hits
            }
            $json.source_files += @{
              name = $sourcePath
              source_digest = ""
              coverage = $lines
            }
          }
          $jsonBody = $json | ConvertTo-Json -Depth 10 -Compress
          $response = Invoke-RestMethod -Uri "https://coveralls.io/api/v1/jobs" -Method Post -Body @{ json = $jsonBody }
          Write-Host "Coveralls response: $($response | ConvertTo-Json)"
