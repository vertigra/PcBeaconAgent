name: Publish Android Client Release

on:
  push:
    tags:
      - 'client.v.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test src/PcBeaconAgent.Server.Core.Tests/PcBeaconAgent.Server.Core.Tests.csproj --configuration Release --logger trx

  publish:
    needs: test
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Parse Version from Tag
      id: parse_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -match 'client\.v\.(\d+)\.(\d+)\.(\d+)') {
            $versionName = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            $versionCode = ([int]$Matches[1] * 1000000) + ([int]$Matches[2] * 1000) + [int]$Matches[3]
            
            echo "VERSION_NAME=$versionName" >> $env:GITHUB_OUTPUT
            echo "VERSION_CODE=$versionCode" >> $env:GITHUB_OUTPUT
        } else {
            Write-Error "Tag $tag does not match format client.v.X.Y.Z"
            exit 1
        }

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x 

    - name: Restore Workloads and Dependencies
      run: |
        dotnet workload restore src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj
        dotnet restore src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj

    - name: Publish Android App
      run: |
        dotnet publish src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj `
          -c Release `
          -f net10.0-android `
          -p:AndroidKeyStore=false `
          -p:AndroidPackageFormat=apk `
          -p:AppVersionCode=${{ steps.parse_version.outputs.VERSION_CODE }} `
          -p:AppVersionName=${{ steps.parse_version.outputs.VERSION_NAME }}

    - name: Prepare Artifact
      shell: pwsh
      run: |
        $apkPath = Get-ChildItem -Path src/PcBeaconAgent.Client.Android/ -Filter *.apk -Recurse | Select-Object -First 1
        if ($apkPath) {
            Copy-Item $apkPath.FullName -Destination "./BeaconClient-v.${{ steps.parse_version.outputs.VERSION_NAME }}.apk"
        } else {
            Write-Error "APK not found!"
            exit 1
        }

    - name: Generate Changelog
      uses: orhun/git-cliff-action@v4
      id: git-cliff
      with:
        config: cliff.toml
        args: --verbose --latest --strip header --include-path "src/PcBeaconAgent.Client.Android/*" --include-path "src/PcBeaconAgent.Client.Core/*"
      env:
        OUTPUT: RELEASE_NOTES.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.0.1
      with:
        files: ./BeaconClient-v.${{ steps.parse_version.outputs.VERSION_NAME }}.apk
        name: Client Android Release ${{ steps.parse_version.outputs.VERSION_NAME }}
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}