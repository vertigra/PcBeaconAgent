name: Publish Android Client Release

on:
  push:
    tags:
      - 'client.v.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Parse Version from Tag
      id: parse_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -match 'client\.v\.(\d+)\.(\d+)\.(\d+)') {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $build = [int]$Matches[3]
            
            $versionName = "$major.$minor.$build"
            $versionCode = ($major * 10000) + ($minor * 100) + $build
            
            echo "VERSION_NAME=$versionName" >> $env:GITHUB_OUTPUT
            echo "VERSION_CODE=$versionCode" >> $env:GITHUB_OUTPUT
        } else {
            Write-Error "Tag $tag does not match expected format client.v.X.Y.Z"
            exit 1
        }

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x 

    - name: Install MAUI Android Workload
      run: dotnet workload install android

    - name: Restore Client Dependencies
      run: dotnet restore src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj

    - name: Publish Android App (Generate APK)
      run: |
        dotnet publish src/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android/PcBeaconAgent.Client.Android.csproj `
          -c Release `
          -f net10.0-android `
          -p:AndroidKeyStore=false `
          -p:AndroidPackageFormat=apk `
          -p:AppVersionCode=${{ steps.parse_version.outputs.VERSION_CODE }} `
          -p:AppVersionName=${{ steps.parse_version.outputs.VERSION_NAME }}

    - name: Prepare Android Artifact File
      shell: pwsh
      run: |
        $apkPath = Get-ChildItem -Path src/PcBeaconAgent.Client.Android/ -Filter *.apk -Recurse | Select-Object -First 1
        if ($apkPath) {
            Copy-Item $apkPath.FullName -Destination "./BeaconClient-${{ github.ref_name }}.apk"
        } else {
            Write-Error "APK file not found!"
            exit 1
        }

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v2.0.1
      with:
        files: ./BeaconClient-${{ github.ref_name }}
        name: Client Android Release ${{ steps.parse_version.outputs.VERSION_NAME }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}